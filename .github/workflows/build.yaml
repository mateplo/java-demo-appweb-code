# Build + push de l'image vers GHCR, sur push de la branche main.
# Chaque push produit 2 tags : `main-<sha>` (immuable, ce qu'Image Updater épingle)
# et `main` (mutable, tag de bootstrap des overlays).
#   main  -> java-demo-appweb:main-<sha>  -> env prod
name: build-and-push

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: java-demo-appweb, context: . }
    steps:
      - uses: actions/checkout@v4

      # Le Dockerfile fait `COPY webapp/target/webapp.war` : il faut donc produire le WAR
      # AVANT le docker build. `target/` est gitignoré => il n'existe pas au checkout.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build WAR (Maven)
        # -DskipTests : les tests tournent déjà au gate PR (lint.yaml) ; ici on empaquette.
        run: mvn -B -ntp clean package -DskipTests

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SHA court
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # 2 tags. github.ref_name = la branche poussée (ici main).
          #   <branche>-<sha7>  = tag unique (traçable)
          #   <branche>         = tag mobile "dernière de la branche"
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}-${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}

  # Ménage post-build : après le push, on ne garde que les 3 dernières images de l'env
  # qui vient d'être poussé (github.ref_name). Pas de cron -> la purge suit les builds.
  # Le tag mutable <branche> (sans tiret) ne matche pas "<branche>-*" -> protégé.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@v3.0.0
        with:
          # Compte PERSO -> littéralement "user" (endpoint /user/packages).
          # Pour une org, on mettrait le nom de l'org à la place.
          account: user
          # snok exige un PAT CLASSIQUE (ghp_) avec delete:packages : le GITHUB_TOKEN
          # (ghs_) est refusé pour supprimer des packages. -> secret GHCR_CLEANUP_TOKEN.
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: "java-demo-appweb"
          image-tags: "${{ github.ref_name }}-*"
          # Ne supprime QUE des versions taggées : ne touche jamais aux sous-manifestes
          # non taggés (attestations, arch) qu'un index référence.
          tag-selection: tagged
          keep-n-most-recent: 3
          # cut-off OBLIGATOIRE en v3 (âge min pour être supprimable). Petit -> keep-n=3
          # pilote. Les 3 plus récentes sont TOUJOURS gardées (dont l'image déployée).
          cut-off: 1h
          dry-run: false

  # Scan sécurité de l'IMAGE fraîchement buildée (needs: build) : couche OS + app.
  trivy-image:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - java-demo-appweb
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"   # report-only ; passe à "1" pour bloquer sur CVE
